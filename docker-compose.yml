version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cloudhire
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend/database:/app/database
      - ./backend/logs:/app/logs
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cloudhire
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend/database:/app/database
      - ./backend/logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cloudhire
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
